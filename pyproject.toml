[project]
name = "brain"
version = "0.1.0"
description = "System 1 and System 2 for LLMs behind one local API: calibrated decisions (Clef) and reasoning (Qwen3.5 + adapters) over llama.cpp"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
brain = "brain.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain", "src/brain_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a real GPU host"]
addopts = "-m 'not gpu'"
