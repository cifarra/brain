id: ranger-max
phase: A
description: "Whole GPU (Experiment 0): calibrated S1 fully on GPU (~0.2 s at 1.7k tokens), Q8_0 S2 at 32k, vision on GPU. Fits only when other GPU users hold < ~2 GiB."
budget: {peak_gb: 22.5}         # GiB; 21.87 = sum of solo peaks (pairs proved additive within 24 MiB)
max_stack: 3
backends:
  s1:
    model: clef-flash-q8_0-abf16
    args: {ctx: 8192, batch: 8192, ubatch: 8192, parallel: 1, flash_attn: "on", ngl: all,
           override_tensor: ["output.weight=CPU"]}
    measured_peak_gb: 11.22
  s2:
    model: qwen3.5-9b-q8_0
    mmproj: qwen3.5-9b-mmproj-f16
    loras: [abliteration]
    args: {ctx: 32768, batch: 2048, ubatch: 512, parallel: 1, flash_attn: "on", ngl: all,
           ctx_checkpoints: 4, cache_type_k: f16, cache_type_v: f16, reasoning_format: deepseek, jinja: true}
    measured_peak_gb: 10.65
roles:
  system1:
    backend: s1
    endpoint: systemone
    default_adapters: {clef: 1.0}
    capabilities: {systemone: true, images: false, max_prompt_tokens: 8192}
  system2:
    backend: s2
    endpoint: chat
    defaults: {thinking: true, reasoning_budget: -1}
    default_adapters: {abliteration: 1.0}
    capabilities: {chat: true, thinking: true, json_schema: true, vision: true, max_context: 32768}
  system2-fast:
    inherits: system2
    defaults: {thinking: false}
approved_stacks: []
