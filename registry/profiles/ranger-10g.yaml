id: ranger-10g
phase: A
description: "Tighter envelope (Experiment 0): calibrated S1 more offloaded (~1.9 s/decision), IQ4_XS S2 at 8k, vision encoder on CPU."
budget: {peak_gb: 10.0}         # GiB; measured 9.58 as a pair
max_stack: 3
backends:
  s1:
    model: clef-flash-q8_0-abf16
    args: {ctx: 2048, batch: 2048, ubatch: 2048, parallel: 1, flash_attn: "on", ngl: 14,
           override_tensor: ["output.weight=CPU"]}
    measured_peak_gb: 4.55
  s2:
    model: qwen3.5-9b-iq4xs
    mmproj: qwen3.5-9b-mmproj-f16
    loras: [abliteration]
    args: {ctx: 8192, batch: 2048, ubatch: 512, parallel: 1, flash_attn: "on", ngl: all, mmproj_offload: false,
           ctx_checkpoints: 4, cache_type_k: q8_0, cache_type_v: q8_0, reasoning_format: deepseek, jinja: true}
    measured_peak_gb: 5.03
roles:
  system1:
    backend: s1
    endpoint: systemone
    default_adapters: {clef: 1.0}
    capabilities: {systemone: true, images: false, max_prompt_tokens: 2048}
  system2:
    backend: s2
    endpoint: chat
    defaults: {thinking: true, reasoning_budget: -1}
    default_adapters: {abliteration: 1.0}
    capabilities: {chat: true, thinking: true, json_schema: true, vision: true, max_context: 8192}
  system2-fast:
    inherits: system2
    defaults: {thinking: false}
approved_stacks: []
